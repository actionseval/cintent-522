name: Tests

# CINTENT >> MANUAL_TRIGGER
# on:
#   push:
#     branches: [ main ]
#   pull_request:
#     branches: [ main ]
on: [repository_dispatch, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
       matrix:
        # CINTENT >> REMOVE_MATRIX
        # python-version: [3.7, 3.8, 3.9]
        python-version: [3.9]
    steps:
    # CINTENT >> CHANGE_VERSION
    # - uses: actions/checkout@v2
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
         python-version: ${{ matrix.python-version }}
    # CINTENT >> INSERT_CINTENT
    - uses: JavidDitty/setup-cintent@3638849e94bdb037f0a405375686a8550e6df904
      with:
        nonblocking: true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions
    - name: Run tox with Python ${{ matrix.python-version }}
      run: |
        python -m tox
    # CINTENT >> INSERT_CINTENT
    - name: Upload CIntent Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ env.CINTENT_ARTIFACT_NAME }}
        path: ${{ env.CINTENT_LOGS }}
